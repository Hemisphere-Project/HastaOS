# RastaOS-7.5 (pi-tools#t-064): no MAC re-randomising on Wi-Fi scans.
# A new random MAC takes the interface down/up; on the idle USB dongles that re-initialises the
# rtl8192cu/rtl8xxxu chip every ~5 min and stalls the player ~0.5 s (underrun, wallclock burst).
[device]
wifi.scan-rand-mac-address=no
