# What bluetooth-pi leaves on a box (docs/DESIGN.md §7, schema 1). Data only.
# Paths in `source` and a relative link `target` are relative to this directory.
schema = 1
requires = ["boot.starter"]
undeclared = [
  "the installer's hook appends AutoEnable=true to /etc/bluetooth/main.conf when it is missing; schema 1 has no line file for it",
  "btattach on /dev/ttyAMA0 at 3 Mbaud: a Buster-era attachment that fights hciuart on later images",
]

[module]
id = "bluetooth-pi"
version = "1.0"
layer = "feature"
summary = "Attach the Pi's Bluetooth controller"

[supports]
machine = ["rpi*"]

[resources.packages]
any = ["bluez", "bluez-tools", "usbutils"]

# Runs from a starter.txt line (`bluetooth-pi`).
[[resources.units]]
name = "bluetooth-pi.service"
state = "disabled"
source = "bluetooth-pi.service"
