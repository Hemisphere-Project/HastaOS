# What webconf leaves on a box (docs/DESIGN.md §7, schema 1). Data only.
# Paths in `source` and a relative link `target` are relative to this directory.
schema = 1
requires = ["boot.starter"]
undeclared = [
  "module.ini `npm = yes`: `npm install` runs inside the checkout (node_modules/ in this directory); a converge never runs it again; node itself comes from no declared package",
  "webconf.service hard-codes WorkingDirectory=/opt/Pi-tools/webconf",
  "on a save it rewrites, in place: starter.txt lines (hostrename@<name>, wint-off@N), psk= in <boot>/wifi/wint-hotspot.nmconnection, hdmi_mode= in config.txt, and the sync role's profiles in <boot>/wifi, then runs setnet, inside one rw/ro bracket",
  "legacy/ is dead Flask code, never linked",
]

[module]
id = "webconf"
version = "1.0"
layer = "feature"
summary = "Web UI on port 4038 for the boot-partition settings, with an mDNS browser at /disco"

[[resources.links]]
path = "/usr/local/bin/webconf"
target = "webconf"

# Runs from a starter.txt line (`webconf`), so its unit is linked, not enabled.
[[resources.units]]
name = "webconf.service"
state = "disabled"
source = "webconf.service"

[[writes]]
path = "/boot/starter.txt"
when = "event"
summary = "on a save from the UI; config.txt and <boot>/wifi too (the boot directory as the box has it)"
