# What blackbox leaves on a box (docs/DESIGN.md §7, schema 1). Data only.
# Paths in `source` and a relative link `target` are relative to this directory.
schema = 1
undeclared = [
  "install.sh removes the v2 leftovers: journal-persist.service and its sysinit.target.wants link; schema 1 cannot declare a unit absent",
  "journal-persist.service and journald-persist.conf are dead files in this directory (v2)",
  "/data/var/log/journal-v2, the v2 journal archived by `install.sh --now`, is kept with no pruner",
  "`install.sh --now` restarts systemd-journald and starts the timers on a running player",
  "reads tvservice, vcgencmd, the ALSA cards Device and Headphones, wint, eth0 and wlan0, and HPlayer2's socket, profile file and nowde-probe through /opt/HPlayer2/.venv: the legacy firmware stack and the player",
]

[module]
id = "blackbox"
version = "1.0"
layer = "core"
summary = "Journald in RAM, one line of player state per minute, and a capped journal export on /data or the flightbox ring"

[supports]
machine = ["rpi*"]

[[resources.files]]
path = "/etc/systemd/journald.conf.d/blackbox.conf"
source = "journald-ram.conf"
mode = "0644"
copy = true

[[resources.links]]
path = "/usr/local/bin/diag"
target = "diag"

[[resources.links]]
path = "/usr/local/bin/blackbox"
target = "blackbox"

[[resources.links]]
path = "/usr/local/bin/journal-export"
target = "journal-export"

[[resources.units]]
name = "blackbox.service"
state = "static"
source = "blackbox.service"

[[resources.units]]
name = "blackbox.timer"
state = "enabled"
wanted_by = ["timers.target"]
source = "blackbox.timer"

[[resources.units]]
name = "journal-export.service"
state = "static"
source = "journal-export.service"

[[resources.units]]
name = "journal-export.timer"
state = "enabled"
wanted_by = ["timers.target"]
source = "journal-export.timer"

[[resources.units]]
name = "blackbox-runcap.service"
state = "enabled"
wanted_by = ["multi-user.target"]
source = "blackbox-runcap.service"

[[state]]
path = "/data/var/diag-armed"
summary = "hours left of armed diagnostics; absent = disarmed"

[[state]]
path = "/data/var/log/journal-export"
summary = "the exported journal, one file a day, when there is no flightbox ring"

[[state]]
path = "/data/var/log/blackbox.log"
summary = "the per-minute player state, 32 MB ceiling, when there is no flightbox ring"

[[writes]]
path = "/data/var/log/journal-export"
when = "steady"
summary = "hourly, only while diag is armed"

[[writes]]
path = "/data/var/log/blackbox.log"
when = "steady"
summary = "rolled from /run/blackbox.log, only while diag is armed"

[[writes]]
path = "/data/var/diag-armed"
when = "event"
summary = "diag arm and disarm"

[[writes]]
path = "/run/blackbox.log"
when = "steady"
summary = "every 60 s, on tmpfs (2 MB x 2)"

[[seal]]
path = "/data/var/log/journal-export"
action = "delete"
summary = "the golden's own trail (the bake empties /data/var/log)"

[[seal]]
path = "/data/var/log/blackbox.log"
action = "delete"

[[seal]]
path = "/data/var/diag-armed"
action = "delete"
summary = "a burned card starts disarmed"
